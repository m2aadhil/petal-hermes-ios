name: Petal
options:
  bundleIdPrefix: org.hermesios
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Petal:
    type: application
    platform: iOS
    sources: [Petal]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hermesios.HermesIOS
        INFOPLIST_FILE: Petal/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [PetalUITests]
  PetalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PetalUITests]
    dependencies:
      - target: Petal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Petal
schemes:
  PetalIntegration:
    build:
      targets:
        Petal: all
        PetalUITests: [test]
    test:
      targets: [PetalUITests]
      environmentVariables:
        HERMES_IOS_INTEGRATION: "1"
  Petal:
    build:
      targets:
        Petal: all
        PetalUITests: [test]
    test:
      targets: [PetalUITests]
